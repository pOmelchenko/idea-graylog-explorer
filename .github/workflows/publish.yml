name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Marketplace channel (first upload must already exist)
        type: choice
        options: [beta, stable]
        default: beta
        required: true

permissions:
  contents: read

concurrency:
  group: marketplace-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: marketplace
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Require publication credentials
        shell: bash
        run: |
          for key in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Configure the required $key secret before publishing. See docs/PUBLISHING.md."
              exit 1
            fi
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Test, verify, sign and publish
        run: ./gradlew --no-daemon check buildPlugin verifyPluginStructure verifyPlugin signPlugin verifyPluginSignature publishPlugin -PverifyIdea=true -PreleaseChannel="$RELEASE_CHANNEL"
      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication-reports
          path: build/reports/
          if-no-files-found: ignore
