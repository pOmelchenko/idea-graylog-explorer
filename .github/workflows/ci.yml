name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Test, package and verify PhpStorm / IDEA compatibility
        run: ./gradlew --no-daemon check buildPlugin verifyPluginStructure verifyPlugin -PverifyIdea=true
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-distribution
          path: build/distributions/graylog-jetbrains-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14
