name: Isolated UI smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Resolve the pinned IDE SDK
        run: |
          ./gradlew --no-daemon writeIdeHome
          echo "IDE_HOME=$(cat build/ide-home.txt)" >> "$GITHUB_ENV"
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build and exercise the real IDE
        env:
          SMOKE_THEME: ${{ matrix.theme }}
        run: |
          python3 build.py --ide-home "$IDE_HOME"
          python3 scripts/smoke_test.py --ide-home "$IDE_HOME" --theme "$SMOKE_THEME" --with-legacy-prototype
      - name: Upload synthetic UI reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-smoke-${{ matrix.theme }}
          path: build/reports/smoke/
          if-no-files-found: ignore
          retention-days: 14
